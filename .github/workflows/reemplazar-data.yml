name: Reemplazar Data.xlsx

on:
  push:
    paths:
      - ".github/workflows/reemplazar-data.yml"

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar Data.xlsx
        run: python3 .data_upload/generar_data.py
      - name: Guardar archivo y limpiar temporales
        run: |
          rm -rf .data_upload
          rm -f .github/workflows/reemplazar-data.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reemplaza Data.xlsx con los datos del ejercicio"
          git push
